			const myElement = document.body;
			
			function playMusic(){
				if (tocando == false){

						console.log('Mouse moved inside my body!');
						console.log('X coordinate:', event.clientX);

						audio.muted = false;
						audio.play();

			myElement.addEventListener('click', function(event) {
